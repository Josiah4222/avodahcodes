<!-- -- HEADER -- -->
<header class="fixed inset-x-0 top-0 z-50 border-b border-outline-variant/70 bg-surface/80 backdrop-blur-md">
  <div class="mx-auto flex w-full max-w-[1200px] items-center justify-between px-margin-mobile py-3.5 sm:px-margin lg:px-margin-desktop">

    <!-- brand -->
    <a routerLink="/" class="group flex items-center gap-3">
      <img src="/avodahCC.jpg" alt="Avodah Codes" width="159" height="144" decoding="async" class="h-9 w-9 shrink-0 rounded-[9999px] object-cover" />
      <span class="font-display text-[15px] font-semibold tracking-tight text-on-surface">Avodah Codes</span>
    </a>

    <!-- desktop nav -->
    <nav class="hidden items-center gap-space-lg md:flex">
      <a routerLink="/" routerLinkActive="text-secondary" [routerLinkActiveOptions]="{ exact: true }" class="font-code-sm text-code-sm uppercase tracking-[0.14em] text-on-surface-variant transition-colors hover:text-on-surface">Home</a>
      <a routerLink="/work" routerLinkActive="text-secondary" class="font-code-sm text-code-sm uppercase tracking-[0.14em] text-on-surface-variant transition-colors hover:text-on-surface">Portfolio</a>
      <a routerLink="/services" routerLinkActive="text-secondary" class="font-code-sm text-code-sm uppercase tracking-[0.14em] text-on-surface-variant transition-colors hover:text-on-surface">Services</a>
    </nav>

    <div class="flex items-center gap-2">
      <!-- CTA -->
      <a routerLink="/contact"
        class="hidden items-center gap-2 rounded-lg bg-secondary px-space-md py-2 font-code-sm text-code-sm font-semibold uppercase tracking-[0.14em] text-on-secondary transition-colors hover:bg-secondary-fixed hover:text-on-secondary-fixed sm:inline-flex">
        Start a Project
        <svg class="h-3.5 w-3.5 shrink-0" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="m256-240-56-56 384-384H240v-80h480v480h-80v-344L256-240Z"/></svg>
      </a>

      <!-- hamburger -->
      <button type="button" (click)="open()" aria-label="Open menu" aria-controls="mobile-menu"
        [attr.aria-expanded]="menuOpen"
        class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-outline-variant text-on-surface transition-colors hover:border-secondary hover:text-secondary md:hidden">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>
    </div>

  </div>
</header>

<!-- -- MOBILE BACKDROP -- -->
<div (click)="close()"
  [class]="menuOpen ? 'pointer-events-auto opacity-100' : 'pointer-events-none opacity-0'"
  class="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm transition-opacity duration-300 md:hidden"
  [attr.aria-hidden]="!menuOpen"></div>

<!-- -- MOBILE DRAWER -- -->
<aside id="mobile-menu" [class.translate-x-full]="!menuOpen"
  class="fixed right-0 top-0 z-[70] flex h-full w-[82%] max-w-sm flex-col overflow-y-auto border-l border-outline-variant bg-surface-container-low px-6 py-6 shadow-2xl transition-transform duration-300 ease-out md:hidden"
  [attr.aria-hidden]="!menuOpen" [attr.inert]="menuOpen ? null : ''">

  <div class="flex items-center justify-between">
    <span class="marker">[ Menu ]</span>
    <button type="button" (click)="close()" aria-label="Close menu"
      class="inline-flex h-10 w-10 items-center justify-center rounded-lg border border-outline-variant text-on-surface transition-colors hover:border-secondary hover:text-secondary">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </div>

  <nav class="mt-10 flex flex-col">
    <a routerLink="/" (click)="close()" routerLinkActive="text-secondary" [routerLinkActiveOptions]="{ exact: true }"
      class="border-b border-outline-variant/60 py-4 font-display text-2xl font-semibold tracking-tight text-on-surface transition-colors hover:text-secondary">Home</a>
    <a routerLink="/work" (click)="close()" routerLinkActive="text-secondary"
      class="border-b border-outline-variant/60 py-4 font-display text-2xl font-semibold tracking-tight text-on-surface transition-colors hover:text-secondary">Portfolio</a>
    <a routerLink="/services" (click)="close()" routerLinkActive="text-secondary"
      class="border-b border-outline-variant/60 py-4 font-display text-2xl font-semibold tracking-tight text-on-surface transition-colors hover:text-secondary">Services</a>
  </nav>

  <a routerLink="/contact" (click)="close()"
    class="mt-8 inline-flex items-center justify-center gap-2 rounded-lg bg-secondary px-space-md py-3 font-code-sm text-code-sm font-semibold uppercase tracking-[0.14em] text-on-secondary transition-colors hover:bg-secondary-fixed hover:text-on-secondary-fixed">
    Start a Project
    <svg class="h-3.5 w-3.5 shrink-0" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="m256-240-56-56 384-384H240v-80h480v480h-80v-344L256-240Z"/></svg>
  </a>

  <div class="mt-auto border-t border-outline-variant/60 pt-6">
    <a href="mailto:avodahcodes&#64;gmail.com" class="block font-code-sm text-code-sm text-on-surface-variant transition-colors hover:text-secondary">avodahcodes&#64;gmail.com</a>
    <a href="tel:+251942365100" class="mt-2 block font-code-sm text-code-sm text-on-surface-variant transition-colors hover:text-secondary">+251 94 236 5100</a>
  </div>

</aside>
